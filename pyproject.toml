[project]
name = "soarm101"
version = "0.2.1"
description = "Setup, repair, and brownout-safe operation tools for the SO-ARM101 (LeRobot)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "lerobot[feetech]>=0.4.4",
    "tomli>=2.0; python_version < '3.11'",
    "typer>=0.26.7",
    "rich>=13",
    # Visualization. rerun-sdk is capped <0.27 to match lerobot's own pin (it has
    # no Python URDF API in 0.26, so we do FK with yourdfpy and log meshes ourselves).
    "rerun-sdk>=0.24,<0.27",
    "yourdfpy>=0.0.56",
]

[project.scripts]
# Single first-class entry point; subcommands live in soarm/cli.py (Typer).
soarm = "soarm.cli:app"

[dependency-groups]
dev = ["pytest>=9.1.0"]

[tool.uv]
# Security override: diffusers <0.38 has two high-severity trust_remote_code RCE
# bypasses (GHSA-7wx4-6vff-v64p, GHSA-98h9-4798-4q5v). lerobot 0.4.x pins
# diffusers <0.36, so we force the patched line. This toolkit never imports
# diffusers itself — only lerobot's diffusion-policy path (unused here) touches it,
# so the override is safe for everything `soarm` actually does.
override-dependencies = ["diffusers>=0.38.0"]

[tool.ruff]
target-version = "py310"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soarm"]
