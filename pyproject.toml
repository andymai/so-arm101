[project]
name = "soarm101"
version = "0.2.1"
description = "Setup, repair, and brownout-safe operation tools for the SO-ARM101 (LeRobot)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "lerobot[feetech]>=0.4.4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
soarm-scan = "soarm.scan:main"
soarm-find-port = "soarm.find_port:main"
soarm-sync-check = "soarm.sync_check:main"
soarm-recenter = "soarm.recenter:main"
soarm-fix-voltage-limit = "soarm.fix_voltage_limit:main"
soarm-calibrate-leader = "soarm.calibrate_leader:main"
soarm-set-protection = "soarm.protect:main"
soarm-teleop = "soarm.teleop:main"
soarm-record = "soarm.record:main"
soarm-calib = "soarm.calib_io:main"

[project.optional-dependencies]
# Visual calibration checking / policy eval. Not needed for hardware bring-up.
# Install with: uv sync --extra sim   (then: python sim/fetch.py)
# NOTE: the stock `python -m mujoco.viewer` (mjpython) crashes on a non-framework
# venv on macOS — use `python sim/view.py` instead. See sim/README.md.
sim = ["mujoco>=3.2", "glfw>=2.6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
target-version = "py310"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soarm"]
